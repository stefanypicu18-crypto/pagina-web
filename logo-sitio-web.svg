<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 554 554" role="img" aria-labelledby="title">
  <title id="title">Logo de El Mundo Web</title>
  <defs>
    <filter id="coral-cutout" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.9373
        0 0 0 0 0.4157
        0 0 0 0 0.2980
       -0.2126 -0.7152 -0.0722 0 1" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0 1 1" />
      </feComponentTransfer>
    </filter>
  </defs>
  <image href="logo-sitio-wed.jpg" width="554" height="554" filter="url(#coral-cutout)" />
</svg>
